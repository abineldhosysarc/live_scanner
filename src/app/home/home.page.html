<ion-header class="headerBackground" mode="md">
  <ion-toolbar class="headerToolbar" mode="md">
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="closeapp()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="headerTitle">{{ documentType || 'Document' }} Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button  (click)="startScan()">Start Scan</ion-button>
<p>latest </p>
  <ion-card *ngIf="scannedData">
    <ion-card-header>
      <ion-card-title>Scanned Barcode</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ scannedData }}</p>
    </ion-card-content>
  </ion-card>

  
</ion-content>
